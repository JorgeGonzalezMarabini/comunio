name: set_lineup

on:
  workflow_dispatch: {}
  schedule:
    # Viernes 15:23 UTC (antes 18:00 UTC) -- confirmado en la FAQ oficial
    # de Futmondo (help.futmondo.com/article/92): el cierre real es "el
    # inicio de la jornada, que siempre coincide con el primer partido", NO
    # una hora de reloj fija. Un partido de viernes de LaLiga puede
    # arrancar desde ~19:00 CEST (17:00 UTC) -- el cron anterior (18:00 UTC
    # = 20:00 CEST) podía quedar DESPUÉS del primer partido en jornadas
    # así, sin que hiciera falta ningún delay de GitHub para llegar tarde.
    # 15:23 UTC deja ~1h40 de margen frente al horario más temprano
    # documentado (+ el delay de GitHub, ver README) sin perder calidad de
    # decisión: los cambios de última hora (lesión/no convocado confirmado
    # cerca del partido) los cubre manage_substitutes.yml por separado.
    # Minuto :23 (no en punto) a propósito, mismo motivo que sync_data.yml.
    # Sigue sin ser un dato dinámico real -- si una jornada empezara antes
    # de esta hora (inusual pero no imposible: mitad de semana tras un
    # parón, o un partido de viernes más temprano de lo documentado hasta
    # ahora), seguiría sin cubrirse; la solución completa requeriría leer
    # el calendario real de la jornada, no implementado todavía.
    - cron: "23 15 * * 5"

permissions:
  contents: write

jobs:
  lineup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m jobs.set_lineup
        env:
          # Pausa rápida de los 5 jobs sin tocar el `schedule:` de cada
          # workflow (ver README, "Pausar el bot sin tocar los 5
          # workflows"). Poner ENABLE_BOT=false como GitHub Variable.
          ENABLE_BOT: ${{ vars.ENABLE_BOT }}
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
          FUTMONDO_USER_ID: ${{ secrets.FUTMONDO_USER_ID }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # lineup_decisions queda registrado en db/futmondo.db (auditoría) — sin
      # este paso se perdería al terminar el run. Ver nota en sync_data.yml.
      - name: Commit BD actualizada
        run: |
          git config user.name "futmondo-bot"
          git config user.email "actions@github.com"
          git add db/futmondo.db logs/
          git diff --staged --quiet || git commit -m "set_lineup: actualiza BD [skip ci]"
          git push
