name: set_lineup

on:
  workflow_dispatch: {}
  schedule:
    # Viernes cada 20 min, 15:23-19:43 UTC (antes una sola vez a las
    # 18:00 UTC) -- confirmado en la FAQ oficial de Futmondo
    # (help.futmondo.com/article/92): el cierre real es "el inicio de la
    # jornada, que siempre coincide con el primer partido", NO una hora de
    # reloj fija. Un partido de viernes de LaLiga puede arrancar desde
    # ~19:00 CEST (17:00 UTC) hasta más tarde (~21:30 CEST / 19:30 UTC) --
    # el cron anterior de una sola ejecución (18:00 UTC = 20:00 CEST) podía
    # quedar DESPUÉS del primer partido en jornadas tempranas, sin ninguna
    # otra oportunidad de corregirlo hasta el viernes siguiente.
    #
    # Repetido cada 20 min en vez de una sola vez -- decisión explícita del
    # usuario (2026-08-18) para mitigar el riesgo de un "clausulazo" (u
    # otra baja) de última hora sobre un titular ya decidido: como
    # jobs/set_lineup.py SIEMPRE recalcula desde cero contra el estado
    # actual de la plantilla, si un titular desaparece entre dos pasadas
    # la siguiente ya lo sustituye antes del cierre real, sin esperar a que
    # manage_substitutes.yml reaccione (ese solo actúa DESPUÉS del cierre,
    # sobre la alineación ya fijada). Mismo razonamiento que llevó a
    # manage_substitutes.yml de cada 2h a cada 20 min (ver README,
    # "Banquillo/suplentes"). Sin coste de ruido en Telegram: el job ya no
    # notifica en las pasadas sin novedad (ver docstring de
    # jobs/set_lineup.py).
    #
    # Rango en UTC AMPLIADO a propósito (2026-08-23) para no depender del
    # cambio de hora: la ventana real que importa es en hora LOCAL de
    # Madrid, 17:23-21:43 (ver LOCAL_WINDOW_START/END en jobs/set_lineup.py
    # y scheduling.py), pero GitHub Actions cron no soporta zona horaria,
    # solo UTC -- y esa ventana local cae en un rango distinto de UTC según
    # haya o no cambio de hora:
    #   - CEST (verano, UTC+2, el caso de cuando se fijó el 15:23-19:43
    #     original): 17:23-21:43 local = 15:23-19:43 UTC.
    #   - CET (invierno, UTC+1): 17:23-21:43 local = 16:23-20:43 UTC -- con
    #     el cron antiguo fijo en 15:23-19:43 UTC, en invierno la ventana
    #     LOCAL real habría sido 16:23-20:43, un margen distinto al
    #     pensado (podía cerrarse 1h antes de lo esperado frente al partido
    #     más tardío).
    # El cron cubre la UNIÓN de ambos rangos UTC (15:23-20:43) y
    # jobs/set_lineup.py filtra en cada ejecución si cae dentro de la
    # ventana LOCAL real vía `scheduling.is_within_local_window()` (usa
    # `zoneinfo`, que conoce las fechas exactas del cambio de hora cada
    # año) -- así no hace falta retocar este cron a mano dos veces al año.
    # Algunas pasadas en el extremo opuesto a la estación actual (p. ej.
    # las de 15:xx UTC en invierno) se disparan pero salen enseguida sin
    # tocar la red ni la BD (ver el filtro en el bloque `__main__`).
    #
    # Minutos :03/:23/:43 (no en punto) por el mismo motivo que
    # sync_data.yml -- ":23" se conserva como ancla porque fue la hora
    # elegida explícitamente por el usuario antes de repetir el cron.
    # Sigue sin ser un dato dinámico real -- si una jornada empezara antes
    # de las 17:23 hora local (inusual pero no imposible: mitad de semana
    # tras un parón), seguiría sin cubrirse; la solución completa
    # requeriría leer el calendario real de la jornada, no implementado
    # todavía.
    - cron: "3,23,43 15-20 * * 5"

permissions:
  contents: write

jobs:
  lineup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m jobs.set_lineup
        env:
          # Pausa rápida de los 5 jobs sin tocar el `schedule:` de cada
          # workflow (ver README, "Pausar el bot sin tocar los 5
          # workflows"). Poner ENABLE_BOT=false como GitHub Variable.
          ENABLE_BOT: ${{ vars.ENABLE_BOT }}
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
          FUTMONDO_USER_ID: ${{ secrets.FUTMONDO_USER_ID }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # lineup_decisions queda registrado en db/futmondo.db (auditoría) — sin
      # este paso se perdería al terminar el run. Ver nota en sync_data.yml.
      - name: Commit BD actualizada
        run: |
          git config user.name "futmondo-bot"
          git config user.email "actions@github.com"
          git add db/futmondo.db logs/
          git diff --staged --quiet || git commit -m "set_lineup: actualiza BD [skip ci]"
          git push
