name: set_lineup

on:
  workflow_dispatch: {}
  # Descomentar y ajustar al cierre real de jornada (antes del primer partido):
  # schedule:
  #   - cron: "0 18 * * 5"  # viernes 18:00 UTC, ejemplo

jobs:
  lineup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m jobs.set_lineup
        env:
          COMUNIO_EMAIL: ${{ secrets.COMUNIO_EMAIL }}
          COMUNIO_PASSWORD: ${{ secrets.COMUNIO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
