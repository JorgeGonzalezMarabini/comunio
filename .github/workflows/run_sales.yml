name: run_sales

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9,21 * * *"  # dos veces al día, poco después de run_market

permissions:
  contents: write

jobs:
  sell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m jobs.run_sales
        env:
          # Pausa rápida de los 5 jobs sin tocar el `schedule:` de cada
          # workflow (ver README, "Pausar el bot sin tocar los 5
          # workflows"). Poner ENABLE_BOT=false como GitHub Variable.
          ENABLE_BOT: ${{ vars.ENABLE_BOT }}
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
          FUTMONDO_USER_ID: ${{ secrets.FUTMONDO_USER_ID }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # sales queda registrado en db/futmondo.db (auditoría) — sin este paso
      # se perdería al terminar el run. Ver nota en sync_data.yml.
      - name: Commit BD actualizada
        run: |
          git config user.name "futmondo-bot"
          git config user.email "actions@github.com"
          git add db/futmondo.db logs/
          git diff --staged --quiet || git commit -m "run_sales: actualiza BD [skip ci]"
          git push
