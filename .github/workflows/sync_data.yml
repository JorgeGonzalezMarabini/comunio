name: sync_data

on:
  workflow_dispatch: {}
  schedule:
    # Minuto 6 (no en punto) a propósito: GitHub retrasa los cron
    # programados EN PUNTO por congestión (es el minuto más solicitado de
    # toda la plataforma) -- confirmado en real (2026-08-18): este mismo
    # job, con cron ":00", entraba sistemáticamente ~30 min tarde. Sin
    # deadline externo (a diferencia de set_lineup/run_market), no importa
    # el minuto exacto -- solo evitar el pico de las horas en punto.
    - cron: "6 8-23 * * *"  # cada hora, 08:06-23:06 UTC (sin madrugada: ningún consumidor corre 00:00-08:00)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m jobs.sync_data
        env:
          # Pausa rápida de los 5 jobs sin tocar el `schedule:` de cada
          # workflow (ver README, "Pausar el bot sin tocar los 5
          # workflows"). Poner ENABLE_BOT=false como GitHub Variable.
          ENABLE_BOT: ${{ vars.ENABLE_BOT }}
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
          FUTMONDO_USER_ID: ${{ secrets.FUTMONDO_USER_ID }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # db/futmondo.db está versionado a propósito (ver README) — sin este
      # paso, cada ejecución partiría del último commit y perdería todo lo
      # sincronizado en el run anterior.
      - name: Commit BD actualizada
        run: |
          git config user.name "futmondo-bot"
          git config user.email "actions@github.com"
          git add db/futmondo.db logs/
          git diff --staged --quiet || git commit -m "sync_data: actualiza BD [skip ci]"
          git push
