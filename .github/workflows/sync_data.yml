name: sync_data

on:
  workflow_dispatch: {}
  schedule:
    # Minuto 6 (no en punto) a propósito: GitHub retrasa los cron
    # programados EN PUNTO por congestión (es el minuto más solicitado de
    # toda la plataforma) -- confirmado en real (2026-08-18): este mismo
    # job, con cron ":00", entraba sistemáticamente ~30 min tarde. Sin
    # deadline externo (a diferencia de set_lineup/run_market), no importa
    # el minuto exacto -- solo evitar el pico de las horas en punto.
    #
    # Ampliado a las 24h (2026-08-23, antes 08:06-23:06 UTC "sin
    # madrugada"): el hueco nocturno se dejó en su día porque ningún
    # consumidor (run_market/run_sales) corría entonces fuera de horario
    # diurno -- ahora que esos dos pasan también a 24h (ver run_market.yml,
    # el mercado no tiene cierre diario real, solo temporizadores por
    # jugador contra Futmondo, no una ventana de actividad humana), ya no
    # hay motivo para que sync_data deje de alimentarlos de datos frescos
    # durante la madrugada.
    - cron: "6 * * * *"  # cada hora, las 24h

# db/futmondo.db es un binario SQLite versionado en git (ver README, sección
# de commits automáticos) que comitean 5 workflows: este, run_market.yml,
# run_sales.yml, manage_substitutes.yml y set_lineup.yml. Al ser binario no
# hay merge posible entre dos commits concurrentes -- el segundo `git push`
# simplemente falla (non-fast-forward).
#
# Hasta 2026-08-23 los 5 usaban minutos coincidentes (varios en :06, o en
# :06/:26/:46) -- colisión CONFIRMADA en real comparando timestamps de commit
# (p. ej. tres commits de sync_data/manage_substitutes/run_market entre las
# 10:32:10 y 10:32:58 del 2026-08-23, pese a tener minutos de cron distintos:
# el retraso de GitHub al disparar cron programados no es fijo ni
# proporcional al minuto pedido, así que escalonar minutos por sí solo NO
# garantiza nada, solo reduce la frecuencia del choque). Se aplican dos
# capas:
#   1. Minutos escalonados entre los 5 (éste se deja en :06 como ancla,
#      igual que antes) -- reduce cuántas veces coinciden.
#   2. `concurrency.group` con el MISMO nombre en los 5 workflows -- esta es
#      la protección real: GitHub Actions serializa (encola, no cancela)
#      cualquier run de cualquiera de los 5 que se solape en el tiempo, sin
#      importar el retraso de cron. `cancel-in-progress: false` a propósito:
#      cancelar un run a medias podría dejar `db/futmondo.db` a medio
#      escribir sin commitear.
concurrency:
  group: db-futmondo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m jobs.sync_data
        env:
          # Pausa rápida de los 5 jobs sin tocar el `schedule:` de cada
          # workflow (ver README, "Pausar el bot sin tocar los 5
          # workflows"). Poner ENABLE_BOT=false como GitHub Variable.
          ENABLE_BOT: ${{ vars.ENABLE_BOT }}
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
          FUTMONDO_USER_ID: ${{ secrets.FUTMONDO_USER_ID }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # db/futmondo.db está versionado a propósito (ver README) — sin este
      # paso, cada ejecución partiría del último commit y perdería todo lo
      # sincronizado en el run anterior.
      - name: Commit BD actualizada
        run: |
          git config user.name "futmondo-bot"
          git config user.email "actions@github.com"
          git add db/futmondo.db logs/
          git diff --staged --quiet || git commit -m "sync_data: actualiza BD [skip ci]"
          git push
