name: run_market

on:
  workflow_dispatch: {}
  schedule:
    # Confirmado en la FAQ oficial de Futmondo (help.futmondo.com/article/141):
    # el mercado NO tiene una hora de cierre diaria única -- cada jugador
    # puesto en venta tiene su propio temporizador individual (1, 2 o 3
    # días configurable por el admin de la liga, ver también
    # `expirationDate` en clients/futmondo_client.py:get_market()). No hay
    # "cierre real" al que ajustar este cron -- ni siquiera con el listado
    # más corto (1 día) haría falta más de 2 pasadas/día para no perder
    # ningún candidato entre que sale y que expira.
    #
    # Subido de 2 a 8 pasadas/día (a petición del usuario, 2026-08-22, tras
    # TODO.md #15 -- ver run_sales.yml): aunque el margen frente a listados
    # de compra sigue siendo el mismo de siempre, correr más seguido
    # también deja que run_market reaccione antes al presupuesto y a la
    # plaza de plantilla que libera una venta aceptada por run_sales (1h
    # después de cada pasada de éste, mismo patrón de siempre).
    #
    # Minuto 6 (no en punto), mismo motivo que sync_data.yml: GitHub retrasa
    # los cron programados EN PUNTO por congestión (minuto más solicitado de
    # toda la plataforma). Sin deadline externo real (ver README, "Delay de
    # GitHub Actions y horas críticas"), es seguro mover el minuto.
    - cron: "6 8,10,12,14,16,18,20,22 * * *"  # cada 2h en horario activo (antes 2 veces/día)

permissions:
  contents: write

jobs:
  bid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m jobs.run_market
        env:
          # Pausa rápida de los 5 jobs sin tocar el `schedule:` de cada
          # workflow (ver README, "Pausar el bot sin tocar los 5
          # workflows"). Poner ENABLE_BOT=false como GitHub Variable.
          ENABLE_BOT: ${{ vars.ENABLE_BOT }}
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
          FUTMONDO_USER_ID: ${{ secrets.FUTMONDO_USER_ID }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # bids queda registrado en db/futmondo.db (auditoría) — sin este paso
      # se perdería al terminar el run. Ver nota en sync_data.yml.
      - name: Commit BD actualizada
        run: |
          git config user.name "futmondo-bot"
          git config user.email "actions@github.com"
          git add db/futmondo.db logs/
          git diff --staged --quiet || git commit -m "run_market: actualiza BD [skip ci]"
          git push
