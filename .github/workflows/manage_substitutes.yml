name: manage_substitutes

on:
  workflow_dispatch: {}
  schedule:
    # Cada 20 min, 10:00-23:00 UTC, viernes a lunes (días y horas de
    # partido en la mayoría de jornadas de LaLiga) -- ajustar al
    # calendario real de la liga de destino. A diferencia del resto de
    # jobs, este necesita correr varias veces durante la jornada, no una
    # vez: ver docstring de jobs/manage_substitutes.py.
    #
    # Antes cada 2h (`0 */2 * * 5,6,0,1`) -- CONFIRMADO insuficiente con un
    # caso real (2026-08-17, ver README "Banquillo/suplentes"): Fotmob
    # confirmó la alineación real de un partido solo 41 min antes del
    # pitido, así que un hueco de 2h entre ejecuciones podía dejar pasar
    # TODA la ventana entre "ya se sabe quién juega" y "el partido ya
    # empezó" sin que el job la viera. Con un solo dato de muestra no se
    # sabe si 41 min es representativo o casual -- 20 min es un valor
    # conservador mientras se acumulan más casos reales, no uno calibrado.
    # Limitado a 10:00-23:00 UTC (no las 24h) para no gastar minutos de
    # Actions de madrugada, cuando LaLiga no juega.
    #
    # Minutos :13/:33/:53 (antes :06/:26/:46) a propósito, mismo motivo que
    # sync_data.yml: GitHub retrasa más los cron en minutos redondos por
    # congestión (confirmado en real, 2026-08-18, con sync_data). Aquí no
    # hay deadline externo -- lo que importa es no dejar pasar más de ~20
    # min reales entre pasadas, así que evitar el pico de congestión ayuda
    # más que perjudica.
    #
    # Escalonado (2026-08-23) frente a sync_data/run_market/run_sales/
    # set_lineup, que también comitean db/futmondo.db -- ver el comentario
    # largo en sync_data.yml y el `concurrency:` de abajo, que es la
    # protección real frente a colisiones de commit/push sobre ese binario.
    - cron: "13,33,53 10-23 * * 5,6,0,1"

concurrency:
  group: db-futmondo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  substitute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m jobs.manage_substitutes
        env:
          # Pausa rápida de los 5 jobs sin tocar el `schedule:` de cada
          # workflow (ver README, "Pausar el bot sin tocar los 5
          # workflows"). Poner ENABLE_BOT=false como GitHub Variable.
          ENABLE_BOT: ${{ vars.ENABLE_BOT }}
          FUTMONDO_TOKEN: ${{ secrets.FUTMONDO_TOKEN }}
          FUTMONDO_USER_ID: ${{ secrets.FUTMONDO_USER_ID }}
          FUTMONDO_CHAMPIONSHIP_ID: ${{ vars.FUTMONDO_CHAMPIONSHIP_ID }}
          FUTMONDO_USERTEAM_ID: ${{ vars.FUTMONDO_USERTEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcional -- ver config.ENABLE_REAL_LINEUP_CHECK (false por
          # defecto si no se define como Variable aquí). Fotmob no exige
          # ninguna key/Secret. Sin activar, este job se comporta igual que
          # sin esta fuente (solo is_injury_status()).
          ENABLE_REAL_LINEUP_CHECK: ${{ vars.ENABLE_REAL_LINEUP_CHECK }}
          # Activado por decisión explícita del usuario (2026-08-17, ver
          # README "Banquillo/suplentes") tras confirmar en vivo que
          # build_substitution_changes()/Fotmob funcionan de punta a punta
          # -- necesario además para que el propio mecanismo de "vuelve a
          # leer Futmondo" evite notificar/auditar la misma sustitución en
          # cada pasada (cron cada 20 min). La secuencia de las dos
          # llamadas HTTP reales de la sustitución en sí sigue sin haberse
          # probado todavía con un caso real (cero lesionados/rotados
          # disponibles hasta la fecha).
          ENABLE_SUBSTITUTE_AUTO_SUBMIT: ${{ vars.ENABLE_SUBSTITUTE_AUTO_SUBMIT }}
      # substitution_decisions queda registrado en db/futmondo.db (auditoría) --
      # sin este paso se perdería al terminar el run. Ver nota en sync_data.yml.
      - name: Commit BD actualizada
        run: |
          git config user.name "futmondo-bot"
          git config user.email "actions@github.com"
          git add db/futmondo.db logs/
          git diff --staged --quiet || git commit -m "manage_substitutes: actualiza BD [skip ci]"
          git push
